name: Run API Bot

on:
  schedule:
    - cron: "0 * * * *"   # jalan setiap jam
  workflow_dispatch:      # bisa dijalankan manual lewat tombol

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}  # ✅ tambahkan ini
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
